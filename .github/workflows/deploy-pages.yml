name: Deploy Dev to GitHub Pages

on:
  push:
    branches: [pwa/feature/dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-flight runs on new push
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v4

      # Collect only the PWA files so we don't publish source dirs
      - name: Prepare deploy directory
        run: |
          mkdir -p _deploy
          cp index.html manifest.json sw.js _deploy/
          cp -r icons _deploy/
          touch _deploy/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

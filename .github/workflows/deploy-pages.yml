name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-flight runs on new push
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute and persist version
        id: ver
        run: |
          # Extract major.minor from the DEV placeholder in source
          MINOR=$(sed -n "s/.*APP_VERSION  = '\([0-9]*\.[0-9]*\)\.DEV'.*/\1/p" index.html)
          PREV_MINOR=$(jq -r '.version' version.json)
          PREV_PATCH=$(jq -r '.patch' version.json)
          if [ "$MINOR" = "$PREV_MINOR" ]; then
            PATCH=$(( PREV_PATCH + 1 ))
          else
            # Version bumped — reset patch to 1
            PATCH=1
          fi
          printf '{"version":"%s","patch":%d}\n' "$MINOR" "$PATCH" > version.json
          echo "full=${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR"           >> "$GITHUB_OUTPUT"

      - name: Commit updated version.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: v${{ steps.ver.outputs.full }} [skip ci]"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p _deploy
          cp index.html manifest.json sw.js _deploy/
          cp -r icons _deploy/
          touch _deploy/.nojekyll
          MINOR="${{ steps.ver.outputs.minor }}"
          VERSION="${{ steps.ver.outputs.full }}"
          sed -i "s/const APP_VERSION  = '${MINOR}\.DEV'/const APP_VERSION  = '${VERSION}'/" _deploy/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

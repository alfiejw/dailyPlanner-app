<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d4a0bc" />
  <meta name="description" content="A simple daily task planner that works offline." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Daily Planner" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <title>Daily Planner</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto+Slab:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --primary:        #d4a0bc;  /* pastel rose-pink */
      --primary-dark:   #be88a6;
      --secondary:      #7ab89a;  /* pastel sage */
      --secondary-dark: #5e9e80;
      --bg:             #f7f2fa;  /* pale lavender-white */
      --card:           #ffffff;
      --text:           #3a3248;  /* deep purple-grey */
      --text-muted:     #8878a0;
      --border:         #e0d0ea;  /* pale purple-pink */
      --radius:         12px;
      --shadow:         0 2px 12px rgba(90,70,120,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    .app-header {
      background: var(--primary);
      color: #fff;
      padding: env(safe-area-inset-top, 0) 20px 18px;
      padding-top: max(env(safe-area-inset-top, 0px), 20px);
      text-align: center;
    }

    .app-header h1 {
      font-family: 'Roboto Slab', Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    .app-header h1 .word-planner { color: rgba(255,255,255,0.72); }

    .date-display {
      margin-top: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    /* ── Day navigation ───────────────────────────────────────────────── */
    .day-nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: var(--secondary);
      padding: 10px 16px;
    }

    .nav-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-side {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-arrow {
      background: rgba(255,255,255,0.18);
      border: none;
      color: #fff;
      font-size: 1.4rem;
      line-height: 1;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .nav-arrow:hover { background: rgba(255,255,255,0.32); }

    .day-label {
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      min-width: 130px;
      text-align: center;
      flex-shrink: 0;
    }

    .today-btn {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 20px;
      color: #fff;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .today-btn:hover { background: rgba(255,255,255,0.28); }

    /* ── Layout ───────────────────────────────────────────────────────── */
    .content {
      max-width: 600px;
      margin: 0 auto;
      padding: 18px 14px 40px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Cards ────────────────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .card-header-row .card-title { margin-bottom: 0; }

    /* ── Progress bar ─────────────────────────────────────────────────── */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-wrap {
      flex: 1;
      background: #ecdaf4;
      border-radius: 20px;
      height: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--secondary);
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    .progress-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--secondary);
      min-width: 52px;
      text-align: right;
    }

    /* ── Composer ─────────────────────────────────────────────────────── */
    .composer {
      display: flex;
      gap: 8px;
    }

    .composer input[type="text"] {
      flex: 1;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      min-width: 0;
    }
    .composer input[type="text"]:focus { border-color: var(--primary); }

    .composer select {
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 0 8px;
      font-family: inherit;
      font-size: 0.78rem;
      color: var(--text);
      background: #fff;
      cursor: pointer;
      outline: none;
      flex-shrink: 0;
    }

    .btn-add {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-size: 1.4rem;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .btn-add:hover { background: var(--primary-dark); }

    /* ── Task list ────────────────────────────────────────────────────── */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg);
      border-radius: 8px;
      transition: opacity 0.2s;
    }
    .task-item.done { opacity: 0.65; }

    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--secondary);
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 0.9rem;
      word-break: break-word;
      min-width: 0;
    }
    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--text);
    }

    .priority-badge {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 0;
      border-radius: 10px;
      flex-shrink: 0;
      width: 44px;
      text-align: center;
    }
    .p-high   { background: #ffd8d8; color: #b03040; }
    .p-normal { background: #c8e0f8; color: #3060a0; }
    .p-low    { background: #cceadc; color: #387060; }

    /* ── Due date bubble ──────────────────────────────────────────── */
    .due-bubble {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ecdaf4;
      border-radius: 7px;
      padding: 3px 7px;
      flex-shrink: 0;
      line-height: 1.35;
      min-width: 44px;
    }
    .due-bubble { background: #fffce0; }
    .due-icon { font-size: 0.85rem; line-height: 1; flex-shrink: 0; }
    .due-time { font-size: 0.7rem;  font-weight: 700; color: var(--text); }
    .due-date { font-size: 0.62rem; color: var(--text-muted); }
    .task-item.done .due-time,
    .task-item.done .due-date { color: var(--text-muted); }

    /* ── Composer due row ─────────────────────────────────────────── */
    .composer-due-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      min-height: 28px;
    }
    .btn-due {
      background: none;
      border: 1px dashed #c0a8d0;
      border-radius: 6px;
      color: #9070a8;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-due:hover { background: #f4eafc; color: var(--primary); border-color: var(--primary); border-style: solid; }
    .due-preview {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #ead8f4;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }
    .due-preview:hover { opacity: 0.8; }
    .due-preview-date { font-weight: 400; color: var(--text-muted); }
    .btn-remove-due {
      background: none;
      border: 1px solid #c0a8d0;
      border-radius: 6px;
      color: #9878b8;
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 2px 8px;
      transition: all 0.15s;
    }
    .btn-remove-due:hover { background: #f4eafc; color: var(--primary); border-color: var(--primary); }

    .btn-delete {
      background: none;
      border: none;
      color: #b098c0;
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .btn-delete:hover { color: var(--primary); }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 18px 0 6px;
    }

    .save-indicator {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--secondary);
      text-align: right;
      margin-top: 10px;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .save-indicator.show { opacity: 1; }

    /* ── Clear done btn ───────────────────────────────────────────────── */
    .btn-ghost {
      background: none;
      border: 1px solid #c4a8d8;
      border-radius: 6px;
      color: #9878b8;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-ghost:hover { background: #f4eafc; color: var(--primary); border-color: var(--primary); }
    .btn-reorder {
      background: none;
      border: 1px solid #c4a8d8;
      border-radius: 6px;
      color: #9878b8;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-reorder:hover { background: #f4eafc; color: var(--primary); border-color: var(--primary); }
    .btn-reorder.active { background: var(--secondary); color: #fff; border-color: var(--secondary); }

    .btn-edit {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      opacity: 0.6;
      transition: opacity 0.15s;
      flex-shrink: 0;
      line-height: 1;
    }
    .btn-edit:hover { opacity: 1; }
    .btn-edit-icon { display: inline-block; font-size: 1rem; transform: scaleX(-1); }

    /* ── Edit modal ────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .modal-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--primary);
    }
    .modal-text-input {
      width: 100%;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    .modal-text-input:focus { border-color: var(--primary); }
    .modal-row { display: flex; align-items: center; gap: 10px; }
    .modal-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .modal-select {
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--card);
      outline: none;
      cursor: pointer;
    }
    .modal-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 4px; }
    .btn-modal-delete {
      background: none;
      border: 1px solid #c04040;
      border-radius: 6px;
      color: #b03030;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-modal-delete:hover { background: #ffeaea; }
    .btn-modal-save {
      background: none;
      border: 1px solid var(--secondary);
      border-radius: 6px;
      color: var(--secondary);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-modal-save:hover { background: #e0f0ea; }

    .drag-handle {
      font-size: 1rem;
      cursor: grab;
      padding: 2px 2px;
      color: #a890c0;
      flex-shrink: 0;
      touch-action: none;
      user-select: none;
    }
    .drag-handle:active { cursor: grabbing; color: var(--secondary); }
    .task-item.reorder-dragging { opacity: 0.4; }
    .drag-insert-line {
      list-style: none;
      height: 3px;
      background: var(--secondary);
      border-radius: 2px;
      margin: 0 4px;
      pointer-events: none;
    }

    .priority-divider {
      list-style: none;
      border-top: 1px solid rgba(120,80,160,0.12);
      margin: 2px 6px;
    }
    /* ── Notes ────────────────────────────────────────────────────────── */
    .notes-textarea {
      width: 100%;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      resize: vertical;
      min-height: 88px;
      outline: none;
      transition: border-color 0.2s;
    }
    .notes-textarea:focus { border-color: var(--secondary); }

    /* ── Footer ───────────────────────────────────────────────────────── */
    .app-footer {
      text-align: center;
      padding: 0 16px 20px;
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    /* ── Responsive ───────────────────────────────────────────────────── */
    @media (max-width: 380px) {
      .app-header h1 { font-size: 1.6rem; }
      .day-label { min-width: 100px; font-size: 0.9rem; }
      .composer select { display: none; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>Daily <span class="word-planner">Planner</span></h1>
    <div class="date-display" id="full-date"></div>
  </header>

  <nav class="day-nav" aria-label="Day navigation">
    <div class="nav-side">
      <button class="today-btn" id="open-cal" aria-label="Pick a date">&#128197;</button>
      <input type="date" id="date-picker" aria-label="Date picker" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0" />
    </div>
    <div class="nav-center">
      <button class="nav-arrow" id="prev-day" aria-label="Previous day">&#8249;</button>
      <div class="day-label" id="day-label" aria-live="polite"></div>
      <button class="nav-arrow" id="next-day" aria-label="Next day">&#8250;</button>
    </div>
    <div class="nav-side">
      <button class="today-btn" id="go-today">Today</button>
    </div>
  </nav>

  <main class="content">

    <!-- Progress -->
    <div class="card">
      <div class="card-title">Progress</div>
      <div class="progress-row">
        <div class="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progress-bar" aria-valuenow="0">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div class="progress-label" id="progress-label">0 / 0</div>
      </div>
    </div>

    <!-- Composer -->
    <div class="card">
      <div class="card-title">Add a Task</div>
      <div class="composer">
        <input
          type="text"
          id="task-input"
          placeholder="What needs doing?"
          maxlength="200"
          autocomplete="off"
          aria-label="New task"
        />
        <select id="priority-select" aria-label="Priority">
          <option value="high">&#9650; High</option>
          <option value="normal" selected>Normal</option>
          <option value="low">&#9660; Low</option>
        </select>
        <button class="btn-add" id="add-btn" aria-label="Add task">+</button>
      </div>
      <div class="composer-due-row">
        <button class="btn-due" id="open-due-btn" aria-label="Set due date and time">+ DUE</button>
        <div class="due-preview" id="due-preview" role="button" tabindex="0" aria-label="Edit due date" style="display:none">
          <span id="due-preview-time"></span>
          <span class="due-preview-date" id="due-preview-date"></span>
        </div>
        <button class="btn-remove-due" id="remove-due-btn" aria-label="Remove due date" style="display:none">Remove</button>
      </div>
      <input type="datetime-local" id="due-picker" aria-label="Due date and time"
        style="position:fixed;opacity:0;pointer-events:none;width:0;height:0" />
    </div>

    <!-- Task list -->
    <div class="card">
      <div class="card-header-row">
        <div class="card-title">Tasks</div>
        <div style="display:flex;gap:6px">
          <button class="btn-reorder" id="reorder-btn">Reorder &#9776;</button>
          <button class="btn-ghost" id="clear-done-btn">Clear done &#128465;</button>
        </div>
      </div>
      <ul class="task-list" id="task-list" aria-label="Task list">
        <li class="empty-state" id="empty-msg">No tasks yet — add one above!</li>
      </ul>
      <div class="save-indicator" id="save-indicator" aria-live="polite">Saved ✓</div>
    </div>

    <!-- Notes -->
    <div class="card">
      <div class="card-title">Notes for the day</div>
      <textarea
        class="notes-textarea"
        id="notes-input"
        placeholder="Jot down anything..."
        maxlength="1000"
        aria-label="Day notes"
      ></textarea>
    </div>

  </main>

  <!-- Edit task modal -->
  <div class="modal-overlay hidden" id="edit-modal" role="dialog" aria-modal="true" aria-label="Edit task">
    <div class="modal-card">
      <div class="modal-title">Edit Task</div>
      <input type="text" class="modal-text-input" id="edit-task-input"
        maxlength="200" autocomplete="off" aria-label="Task title" />
      <div class="modal-row">
        <span class="modal-label">Priority</span>
        <select class="modal-select" id="edit-priority-select" aria-label="Priority">
          <option value="high">&#9650; High</option>
          <option value="normal" selected>Normal</option>
          <option value="low">&#9660; Low</option>
        </select>
      </div>
      <div class="composer-due-row">
        <button class="btn-due" id="edit-open-due-btn" aria-label="Set due date and time">+ DUE</button>
        <div class="due-preview" id="edit-due-preview" role="button" tabindex="0" aria-label="Edit due date" style="display:none">
          <span id="edit-due-time"></span>
          <span class="due-preview-date" id="edit-due-date"></span>
        </div>
        <button class="btn-remove-due" id="edit-remove-due-btn" aria-label="Remove due date" style="display:none">Remove</button>
      </div>
      <input type="datetime-local" id="edit-due-picker"
        style="position:fixed;opacity:0;pointer-events:none;width:0;height:0" />
      <div class="modal-footer">
        <button class="btn-modal-delete" id="edit-delete-btn">Delete</button>
        <button class="btn-modal-save" id="edit-save-btn">Save</button>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <div>Daily Planner v0.1 &nbsp;<span class="network-badge" id="network-badge"></span></div>
    <div class="footer-actions">
      <button class="btn-ghost" id="export-btn">Export backup &#8675;</button>
      <button class="btn-ghost" id="import-btn">Import backup &#8673;</button>
      <input type="file" id="import-input" accept=".json" style="display:none" />
    </div>
  </footer>

  <script>
    // ── Date helpers ──────────────────────────────────────────────────────────

    function toKey(d) {
      // Local date key "YYYY-MM-DD" — avoids UTC drift
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function formatFull(d) {
      return d.toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
      });
    }

    function formatShort(d) {
      const todayKey = toKey(new Date());
      const key = toKey(d);
      const diff = Math.round(
        (new Date(key + 'T00:00:00') - new Date(todayKey + 'T00:00:00')) / 86400000
      );
      if (diff === 0)  return 'Today';
      if (diff === 1)  return 'Tomorrow';
      if (diff === -1) return 'Yesterday';
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function formatDueTime(iso) {
      const d = new Date(iso);
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function formatDueDate(iso) {
      return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    function shiftDay(d, n) {
      const copy = new Date(d);
      copy.setDate(copy.getDate() + n);
      return copy;
    }

    // ── Storage ───────────────────────────────────────────────────────────────

    const STORAGE_KEY  = 'plannerData';
    const APP_VERSION  = '0.1';

    function loadAll() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
      catch { return {}; }
    }

    function saveAll(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function getDayData(key) {
      return loadAll()[key] || { tasks: [], notes: '' };
    }

    function saveDayData(key, dayData) {
      const all = loadAll();
      all[key] = dayData;
      saveAll(all);
      flashSaved();
    }

    // ── State ─────────────────────────────────────────────────────────────────

    let currentDate = new Date();

    // ── Rollover ──────────────────────────────────────────────────────────────

    function rolloverPastTasks() {
      const todayKey = toKey(new Date());
      const all = loadAll();
      let changed = false;

      Object.keys(all).forEach(key => {
        if (key >= todayKey) return;
        const incomplete = (all[key].tasks || []).filter(t => !t.done);
        if (!incomplete.length) return;

        const today = all[todayKey] || { tasks: [], notes: '' };
        const existing = new Set(today.tasks.map(t => t.id));
        incomplete.forEach(t => { if (!existing.has(t.id)) { today.tasks.push(t); existing.add(t.id); } });
        all[todayKey] = today;
        all[key].tasks = all[key].tasks.filter(t => t.done);
        changed = true;
      });

      if (changed) saveAll(all);
    }

    // ── Render ────────────────────────────────────────────────────────────────

    function render() {
      rolloverPastTasks();
      const key = toKey(currentDate);
      const day = getDayData(key);

      document.getElementById('full-date').textContent  = formatFull(new Date());
      document.getElementById('day-label').textContent   = formatShort(currentDate);
      document.getElementById('notes-input').value       = day.notes || '';

      renderTasks(day.tasks || []);
    }

    const PRIORITY_ORDER = { high: 0, normal: 1, low: 2 };

    function renderTasks(tasks) {
      // Stable sort preserves user-defined array order within each priority group
      const sorted = [...tasks].sort((a, b) =>
        (PRIORITY_ORDER[a.priority] ?? 1) - (PRIORITY_ORDER[b.priority] ?? 1)
      );
      tasks = sorted;
      const list  = document.getElementById('task-list');
      const fill  = document.getElementById('progress-fill');
      const bar   = document.getElementById('progress-bar');
      const label = document.getElementById('progress-label');

      list.innerHTML = '';

      if (!tasks.length) {
        const li = document.createElement('li');
        li.className = 'empty-state';
        li.id = 'empty-msg';
        li.textContent = 'No tasks yet — add one above!';
        list.appendChild(li);
        fill.style.width = '0%';
        bar.setAttribute('aria-valuenow', 0);
        label.textContent = '0 / 0';
        return;
      }

      const done = tasks.filter(t => t.done).length;
      const pct  = Math.round((done / tasks.length) * 100);
      fill.style.width = pct + '%';
      bar.setAttribute('aria-valuenow', pct);
      label.textContent = `${done} / ${tasks.length}`;

      let prevPriority = null;
      tasks.forEach(task => {
        if (prevPriority !== null && task.priority !== prevPriority) {
          const div = document.createElement('li');
          div.className = 'priority-divider';
          list.appendChild(div);
        }
        prevPriority = task.priority;

        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.dataset.id = task.id;

        let firstEl;
        if (reorderMode) {
          const handle = document.createElement('span');
          handle.className = 'drag-handle';
          handle.textContent = '\u2630';
          handle.setAttribute('aria-label', 'Hold to reorder');
          handle.addEventListener('pointerdown', e => {
            e.preventDefault();
            // Release implicit capture so pointermove/pointerup bubble to document
            e.target.releasePointerCapture(e.pointerId);
            startDrag(task.id);
          });
          firstEl = handle;
        } else {
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = task.done;
          cb.setAttribute('aria-label', `Mark "${task.text}" as ${task.done ? 'not done' : 'done'}`);
          cb.addEventListener('change', () => toggleTask(task.id));
          firstEl = cb;
        }

        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = task.text;

        const badge = document.createElement('span');
        const p = task.priority || 'normal';
        badge.className = `priority-badge p-${p}`;
        badge.textContent = p === 'normal' ? 'NORM' : p;

        const editBtn = document.createElement('button');
        editBtn.className = 'btn-edit';
        editBtn.innerHTML = '<span class="btn-edit-icon">&#x270E;</span>';
        editBtn.setAttribute('aria-label', `Edit task: ${task.text}`);
        editBtn.addEventListener('click', () => openEditor(task.id));

        if (task.due) {
          const now = new Date();
          const dueD = new Date(task.due);
          const overdue = dueD < now;
          const dueToday = !overdue && toKey(dueD) === toKey(now);
          const bubble = document.createElement('div');
          bubble.className = 'due-bubble';
          const tEl = document.createElement('span'); tEl.className = 'due-time'; tEl.textContent = formatDueTime(task.due);
          const dEl = document.createElement('span'); dEl.className = 'due-date'; dEl.textContent = formatDueDate(task.due);
          if (!task.done && (overdue || dueToday)) {
            const icon = document.createElement('span');
            icon.className = 'due-icon';
            icon.textContent = overdue ? '\u274C' : '\u26A0\uFE0F';
            bubble.append(icon, tEl, dEl);
          } else {
            bubble.append(tEl, dEl);
          }
          li.append(firstEl, span, bubble, badge, editBtn);
        } else {
          li.append(firstEl, span, badge, editBtn);
        }
        list.appendChild(li);
      });
    }

    // ── Task actions ──────────────────────────────────────────────────────────

    let pendingDue = '';

    let reorderMode = false;
    let dragId      = null;
    let dragOverId  = null;
    let dragEl      = null;
    let dragBefore  = false;

    function toggleReorder() {
      reorderMode = !reorderMode;
      document.getElementById('reorder-btn').classList.toggle('active', reorderMode);
      renderTasks(getDayData(toKey(currentDate)).tasks);
    }

    function startDrag(id) {
      dragId = id;
      dragEl = document.querySelector(`.task-item[data-id="${id}"]`);
      if (!dragEl) return;
      dragEl.classList.add('reorder-dragging');
      document.addEventListener('pointermove', onDragMove, { passive: false });
      document.addEventListener('pointerup', onDragEnd);
      document.addEventListener('pointercancel', onDragEnd);
    }

    function onDragMove(e) {
      e.preventDefault();
      if (!dragId || !dragEl) return;

      // Hide both the dragged item and the insert line so elementFromPoint sees through them
      const existingLine = document.querySelector('.drag-insert-line');
      dragEl.style.visibility = 'hidden';
      if (existingLine) existingLine.style.display = 'none';
      const under = document.elementFromPoint(e.clientX, e.clientY);
      dragEl.style.visibility = '';
      if (existingLine) existingLine.style.display = '';

      const targetLi = under?.closest('.task-item[data-id]');
      // If pointer is over a gap, divider, or insert line — keep the existing line unchanged
      if (!targetLi || targetLi === dragEl) return;

      const targetId = Number(targetLi.dataset.id);
      const day = getDayData(toKey(currentDate));
      const dragTask   = day.tasks.find(t => t.id === dragId);
      const targetTask = day.tasks.find(t => t.id === targetId);
      if (!dragTask || !targetTask || dragTask.priority !== targetTask.priority) return;

      const rect   = targetLi.getBoundingClientRect();
      const before = e.clientY < rect.top + rect.height / 2;

      // Skip DOM update if the insertion point hasn't actually changed
      if (targetId === dragOverId && before === dragBefore && existingLine) return;

      dragOverId = targetId;
      dragBefore = before;

      if (existingLine) existingLine.remove();
      const line = document.createElement('li');
      line.className = 'drag-insert-line';
      targetLi.parentNode.insertBefore(line, before ? targetLi : targetLi.nextSibling);
    }

    function onDragEnd() {
      document.removeEventListener('pointermove', onDragMove);
      document.removeEventListener('pointerup', onDragEnd);
      document.removeEventListener('pointercancel', onDragEnd);

      if (dragId && dragOverId && dragId !== dragOverId) {
        const key   = toKey(currentDate);
        const day   = getDayData(key);
        const tasks = day.tasks;
        const fromIdx = tasks.findIndex(t => t.id === dragId);
        let   toIdx   = tasks.findIndex(t => t.id === dragOverId);
        if (fromIdx !== -1 && toIdx !== -1 &&
            tasks[fromIdx].priority === tasks[toIdx].priority) {
          const [moved] = tasks.splice(fromIdx, 1);
          toIdx = tasks.findIndex(t => t.id === dragOverId);
          tasks.splice(dragBefore ? toIdx : toIdx + 1, 0, moved);
          saveDayData(key, day);
        }
      }

      document.querySelectorAll('.drag-insert-line').forEach(el => el.remove());
      document.querySelectorAll('.reorder-dragging')
        .forEach(el => el.classList.remove('reorder-dragging'));
      dragId = dragOverId = dragEl = null;
      renderTasks(getDayData(toKey(currentDate)).tasks);
    }

    function updateDueDisplay() {
      const preview   = document.getElementById('due-preview');
      const openBtn   = document.getElementById('open-due-btn');
      const removeBtn = document.getElementById('remove-due-btn');
      if (pendingDue) {
        openBtn.style.display   = 'none';
        preview.style.display   = 'flex';
        removeBtn.style.display = '';
        document.getElementById('due-preview-time').textContent = formatDueTime(pendingDue);
        document.getElementById('due-preview-date').textContent = formatDueDate(pendingDue);
      } else {
        openBtn.style.display   = '';
        preview.style.display   = 'none';
        removeBtn.style.display = 'none';
      }
    }

    function addTask() {
      const input = document.getElementById('task-input');
      const text  = input.value.trim();
      if (!text) { input.focus(); return; }

      const priority = document.getElementById('priority-select').value;
      const key = toKey(currentDate);
      const day = getDayData(key);

      day.tasks.push({ id: Date.now(), text, done: false, priority, due: pendingDue || null });
      saveDayData(key, day);

      input.value = '';
      pendingDue = '';
      document.getElementById('due-picker').value = '';
      updateDueDisplay();
      input.focus();
      render();
    }

    function toggleTask(id) {
      const key = toKey(currentDate);
      const day = getDayData(key);
      const t   = day.tasks.find(t => t.id === id);
      if (!t) return;
      t.done = !t.done;
      saveDayData(key, day);
      renderTasks(day.tasks);
    }

    function deleteTask(id) {
      const key = toKey(currentDate);
      const day = getDayData(key);
      day.tasks = day.tasks.filter(t => t.id !== id);
      saveDayData(key, day);
      renderTasks(day.tasks);
    }

    function clearDone() {
      const key = toKey(currentDate);
      const day = getDayData(key);
      if (!day.tasks.some(t => t.done)) return;
      if (!confirm('Remove all completed tasks?')) return;
      day.tasks = day.tasks.filter(t => !t.done);
      saveDayData(key, day);
      renderTasks(day.tasks);
    }

    // ── Task editor ────────────────────────────────────────────────────────────

    let editingTaskId = null;
    let editingDue    = '';

    function updateEditDueDisplay() {
      const preview   = document.getElementById('edit-due-preview');
      const openBtn   = document.getElementById('edit-open-due-btn');
      const removeBtn = document.getElementById('edit-remove-due-btn');
      if (editingDue) {
        openBtn.style.display   = 'none';
        preview.style.display   = 'flex';
        removeBtn.style.display = '';
        document.getElementById('edit-due-time').textContent = formatDueTime(editingDue);
        document.getElementById('edit-due-date').textContent = formatDueDate(editingDue);
      } else {
        openBtn.style.display   = '';
        preview.style.display   = 'none';
        removeBtn.style.display = 'none';
      }
    }

    function openEditor(id) {
      const day = getDayData(toKey(currentDate));
      const task = day.tasks.find(t => t.id === id);
      if (!task) return;
      editingTaskId = id;
      editingDue = task.due || '';
      document.getElementById('edit-task-input').value = task.text;
      document.getElementById('edit-priority-select').value = task.priority || 'normal';
      document.getElementById('edit-due-picker').value = editingDue;
      updateEditDueDisplay();
      document.getElementById('edit-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('edit-task-input').focus(), 50);
    }

    function closeEditor() {
      document.getElementById('edit-modal').classList.add('hidden');
      editingTaskId = null;
      editingDue = '';
    }

    function saveEdit() {
      const text = document.getElementById('edit-task-input').value.trim();
      if (!text || !editingTaskId) return;
      const key = toKey(currentDate);
      const day = getDayData(key);
      const task = day.tasks.find(t => t.id === editingTaskId);
      if (!task) return;
      task.text = text;
      task.priority = document.getElementById('edit-priority-select').value;
      task.due = editingDue || null;
      saveDayData(key, day);
      closeEditor();
      render();
    }

    function deleteFromEditor() {
      if (!editingTaskId) return;
      deleteTask(editingTaskId);
      closeEditor();
    }

    // ── Notes autosave ────────────────────────────────────────────────────────

    let notesTimer;
    document.getElementById('notes-input').addEventListener('input', () => {
      clearTimeout(notesTimer);
      notesTimer = setTimeout(() => {
        const key = toKey(currentDate);
        const day = getDayData(key);
        day.notes = document.getElementById('notes-input').value;
        saveDayData(key, day);
      }, 600);
    });

    // ── Save flash ────────────────────────────────────────────────────────────

    let saveTimer;
    function flashSaved() {
      const el = document.getElementById('save-indicator');
      el.classList.add('show');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => el.classList.remove('show'), 1500);
    }

    // ── Event wiring ──────────────────────────────────────────────────────────

    document.getElementById('add-btn').addEventListener('click', addTask);
    document.getElementById('task-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });
    document.getElementById('prev-day').addEventListener('click', () => {
      currentDate = shiftDay(currentDate, -1);
      render();
    });
    document.getElementById('next-day').addEventListener('click', () => {
      currentDate = shiftDay(currentDate, 1);
      render();
    });
    document.getElementById('go-today').addEventListener('click', () => {
      currentDate = new Date();
      render();
    });
    document.getElementById('reorder-btn').addEventListener('click', toggleReorder);
    document.getElementById('clear-done-btn').addEventListener('click', clearDone);

    document.getElementById('edit-save-btn').addEventListener('click', saveEdit);
    document.getElementById('edit-delete-btn').addEventListener('click', deleteFromEditor);

    const editDuePicker = document.getElementById('edit-due-picker');
    document.getElementById('edit-due-preview').addEventListener('click', () => {
      editDuePicker.showPicker?.() || editDuePicker.click();
    });
    document.getElementById('edit-open-due-btn').addEventListener('click', () => {
      const now = new Date();
      now.setMinutes(Math.ceil((now.getMinutes() + 1) / 30) * 30, 0, 0);
      const pad = n => String(n).padStart(2, '0');
      if (!editDuePicker.value) {
        editDuePicker.value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
      }
      editingDue = editDuePicker.value;
      updateEditDueDisplay();
      editDuePicker.showPicker?.() || editDuePicker.click();
    });
    editDuePicker.addEventListener('change', () => {
      editingDue = editDuePicker.value || '';
      updateEditDueDisplay();
    });
    document.getElementById('edit-remove-due-btn').addEventListener('click', () => {
      editingDue = '';
      editDuePicker.value = '';
      updateEditDueDisplay();
    });

    const duePicker = document.getElementById('due-picker');
    document.getElementById('due-preview').addEventListener('click', () => {
      duePicker.showPicker?.() || duePicker.click();
    });
    document.getElementById('open-due-btn').addEventListener('click', () => {
      // Always pre-fill so confirming without editing still commits the value
      const now = new Date();
      now.setMinutes(Math.ceil((now.getMinutes() + 1) / 30) * 30, 0, 0);
      const pad = n => String(n).padStart(2, '0');
      if (!duePicker.value) {
        duePicker.value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
      }
      pendingDue = duePicker.value;
      updateDueDisplay();
      duePicker.showPicker?.() || duePicker.click();
    });
    duePicker.addEventListener('change', () => {
      pendingDue = duePicker.value || '';
      updateDueDisplay();
    });
    document.getElementById('remove-due-btn').addEventListener('click', () => {
      pendingDue = '';
      duePicker.value = '';
      updateDueDisplay();
    });

    const datePicker = document.getElementById('date-picker');
    document.getElementById('open-cal').addEventListener('click', () => {
      datePicker.value = toKey(currentDate);
      datePicker.showPicker?.() || datePicker.click();
    });
    datePicker.addEventListener('change', () => {
      if (!datePicker.value) return;
      const [y, m, d] = datePicker.value.split('-').map(Number);
      currentDate = new Date(y, m - 1, d);
      render();
    });

    // ── Boot ──────────────────────────────────────────────────────────────────

    render();
    updateNetworkBadge();
    navigator.storage?.persist?.();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }

    // ── Network status ────────────────────────────────────────────────────────

    function updateNetworkBadge() {
      const el = document.getElementById('network-badge');
      if (navigator.onLine) {
        el.textContent = '(online)';
        el.className = 'network-badge network-online';
      } else {
        el.textContent = '(offline)';
        el.className = 'network-badge network-offline';
      }
    }
    window.addEventListener('online',  updateNetworkBadge);
    window.addEventListener('offline', updateNetworkBadge);

    // ── OPFS backup (called only by manual export; not on every save) ──────────
    // Writes to origin-private file system: local_app_storage/alfiejwDailyPlannerApp/backup.json
    // Note: OPFS is sandboxed — not visible in the phone's file manager.
    // Use the Export button to save to Downloads instead.

    async function backupToOPFS() {
      // Race the write against a 4-second timeout so a stalled OPFS promise can't block forever
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000));
      try {
        await Promise.race([doOPFSWrite(), timeout]);
        setBackupStatus('done');
      } catch (err) {
        console.warn('OPFS backup:', err.message || err);
        setBackupStatus('error');
      }
    }

    async function doOPFSWrite() {
      if (!navigator.storage?.getDirectory) throw new Error('no OPFS');
      const root  = await navigator.storage.getDirectory();
      const dir1  = await root.getDirectoryHandle('local_app_storage', { create: true });
      const dir2  = await dir1.getDirectoryHandle('alfiejwDailyPlannerApp', { create: true });
      const fh    = await dir2.getFileHandle('backup.json', { create: true });
      // createWritable is absent or broken on iOS Safari < 17
      if (typeof fh.createWritable !== 'function') throw new Error('createWritable unsupported');
      const writable = await fh.createWritable();
      await writable.write(JSON.stringify({
        version: 1, appVersion: APP_VERSION,
        exportedAt: new Date().toISOString(),
        plannerData: loadAll()
      }, null, 2));
      await writable.close();
    }

    // ── Export / Import ───────────────────────────────────────────────────────

    function exportData() {
      const payload = JSON.stringify({
        version: 1, appVersion: APP_VERSION,
        exportedAt: new Date().toISOString(),
        plannerData: loadAll()
      }, null, 2);
      const url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
      const a = Object.assign(document.createElement('a'), {
        href: url,
        download: `planner-backup-${new Date().toISOString().slice(0,10)}.json`
      });
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          const raw = parsed.plannerData ?? parsed;
          const normalized = {};
          Object.entries(raw).forEach(([date, day]) => {
            normalized[date] = {
              tasks: (day.tasks || []).map(t => ({
                id:       t.id       ?? Date.now(),
                text:     t.text     ?? '',
                done:     t.done     ?? false,
                priority: t.priority ?? 'normal',
                due:      t.due      ?? null,
              })),
              notes: day.notes ?? ''
            };
          });
          saveAll(normalized);
          render();
        } catch {
          alert('Invalid or unrecognised backup file.');
        }
      };
      reader.readAsText(file);
    }

    document.getElementById('export-btn').addEventListener('click', () => {
      if (confirm('Export your planner data as a JSON file to your Downloads folder?\n\nYour current data will not be affected — this only creates a copy.')) exportData();
    });
    document.getElementById('import-btn').addEventListener('click', () => {
      if (confirm('Import a backup file?\n\nThis will REPLACE all current tasks and notes with the data from the file. This cannot be undone.')) {
        document.getElementById('import-input').click();
      }
    });
    document.getElementById('import-input').addEventListener('change', e => {
      if (e.target.files[0]) { importData(e.target.files[0]); e.target.value = ''; }
    });
  </script>
</body>

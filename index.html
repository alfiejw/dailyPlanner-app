<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d4a0bc" />
  <meta name="description" content="A simple daily task planner that works offline." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="JessBoard" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <title>JessBoard</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto+Slab:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --primary:        #d4a0bc;  /* pastel rose-pink */
      --primary-dark:   #be88a6;
      --secondary:      #7ab89a;  /* pastel sage */
      --secondary-dark: #5e9e80;
      --bg:             #f7f2fa;  /* pale lavender-white */
      --card:           #ffffff;
      --text:           #3a3248;  /* deep purple-grey */
      --text-muted:     #8878a0;
      --border:         #e0d0ea;  /* pale purple-pink */
      --radius:         12px;
      --shadow:         0 2px 12px rgba(90,70,120,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: var(--text);
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    .app-header {
      background: var(--primary);
      color: #fff;
      padding: env(safe-area-inset-top, 0) 20px 10px;
      padding-top: max(env(safe-area-inset-top, 0px), 16px);
      text-align: center;
    }

    .app-header h1 {
      font-family: 'Roboto Slab', Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    .app-header h1 .word-board { color: rgba(255,255,255,0.72); }

    .date-display {
      margin-top: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .app-header { flex-shrink: 0; }
    .tab-bar     { flex-shrink: 0; }
    .app-footer  { flex-shrink: 0; }

    /* Tab panels fill remaining height as scrollable flex columns */
    .tab-panel { flex: 1; display: none; flex-direction: column; overflow: hidden; min-height: 0; }
    .panel-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
    .panel-fixed  { flex-shrink: 0; }

    /* day-nav and week-nav stay fixed at top of their panels */
    .tab-panel .day-nav { flex-shrink: 0; }

    /* Week scroll area fills its panel when tab-panel is flex */
    #panel-week .week-scroll-area { flex: 1; height: auto; margin-top: 0; }

    /* ── Tab bar ──────────────────────────────────────────────────────── */
    .tab-bar {
      display: flex;
      background: var(--secondary);
      padding: 6px 16px 0;
      gap: 3px;
    }
    .tab {
      flex: 1;
      min-width: 0;
      background: rgba(0,0,0,0.12);
      border: none;
      border-radius: 8px 8px 0 0;
      color: rgba(255,255,255,0.65);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      overflow: hidden;
      padding: 7px 4px 8px;
      text-overflow: ellipsis;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .tab.active { background: var(--bg); color: var(--secondary); }
    .tab:not(.active):hover { background: rgba(255,255,255,0.2); color: #fff; }

    /* ── Day navigation ───────────────────────────────────────────────── */
    .day-nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: var(--primary);
      padding: 10px 16px;
      margin: 12px 14px 0;
      border-radius: var(--radius);
    }

    .nav-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-side {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-arrow {
      background: rgba(255,255,255,0.18);
      border: none;
      color: #fff;
      font-size: 1.4rem;
      line-height: 1;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .nav-arrow:hover { background: rgba(255,255,255,0.32); }

    .day-label {
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      min-width: 130px;
      text-align: center;
      flex-shrink: 0;
    }

    .today-btn {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 20px;
      color: #fff;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .today-btn:hover { background: rgba(255,255,255,0.28); }
    #open-cal, #week-open-cal { font-size: 1.1rem; }
    [data-tab="settings"] { font-size: 1.2rem; }
    [data-tab="bin"]      { font-size: 1.3rem; }
    /* ── Layout ───────────────────────────────────────────────────────── */
    .content {
      max-width: 600px;
      margin: 0 auto;
      padding: 18px 14px 40px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Cards ────────────────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .card-header-row .card-title { margin-bottom: 0; }

    /* ── Progress bar ─────────────────────────────────────────────────── */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-wrap {
      flex: 1;
      background: #ecdaf4;
      border-radius: 20px;
      height: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--secondary);
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    .progress-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--secondary);
      min-width: 52px;
      text-align: right;
    }

    /* ── Composer ─────────────────────────────────────────────────────── */
    .composer {
      display: flex;
      gap: 8px;
    }

    .composer input[type="text"] {
      flex: 1;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      min-width: 0;
    }
    .composer input[type="text"]:focus { border-color: var(--primary); }

    .composer select {
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 0 8px;
      font-family: inherit;
      font-size: 0.78rem;
      color: var(--text);
      background: #fff;
      cursor: pointer;
      outline: none;
      flex-shrink: 0;
    }

    .btn-add {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-size: 2rem;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .btn-add:hover { background: var(--primary-dark); }

    /* ── Task list ────────────────────────────────────────────────────── */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg);
      border-radius: 8px;
      transition: opacity 0.2s;
    }
    .task-item.done { opacity: 0.65; }

    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--secondary);
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 0.9rem;
      word-break: break-word;
      min-width: 0;
    }
    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--text);
    }

    .priority-badge {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 0;
      border-radius: 10px;
      flex-shrink: 0;
      width: 44px;
      text-align: center;
    }
    .p-high   { background: #ffd8d8; color: #b03040; }
    .p-normal { background: #c8e0f8; color: #3060a0; }
    .p-low    { background: #cceadc; color: #387060; }

    /* ── Due date bubble ──────────────────────────────────────────── */
    .due-bubble {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ecdaf4;
      border-radius: 7px;
      padding: 3px 7px;
      flex-shrink: 0;
      line-height: 1.35;
      min-width: 44px;
    }
    .due-bubble { background: #fffce0; }
    .due-icon { font-size: 0.85rem; line-height: 1; flex-shrink: 0; }
    .due-time { font-size: 0.9rem;  font-weight: 700; color: var(--text); }
    .due-date { font-size: 0.9rem; color: var(--text-muted); }
    .task-item.done .due-time,
    .task-item.done .due-date { color: var(--text-muted); }

    /* ── Composer due row ─────────────────────────────────────────── */
    .composer-due-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      min-height: 28px;
    }
    .btn-due {
      background: none;
      border: 1px dashed #c0a8d0;
      border-radius: 6px;
      color: #9070a8;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-due:hover { background: #f4eafc; color: var(--primary); border-color: var(--primary); border-style: solid; }
    .due-preview {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #ead8f4;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }
    .due-preview:hover { opacity: 0.8; }
    .due-preview-date { font-weight: 400; color: var(--text-muted); }
    .btn-remove-due {
      background: none;
      border: 1px solid #c0a8d0;
      border-radius: 6px;
      color: #9878b8;
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 2px 8px;
      transition: all 0.15s;
    }
    .btn-remove-due:hover { background: #f4eafc; color: var(--primary); border-color: var(--primary); }

    .btn-delete {
      background: none;
      border: none;
      color: #b098c0;
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .btn-delete:hover { color: var(--primary); }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 18px 0 6px;
    }

    .save-indicator {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--secondary);
      text-align: right;
      margin-top: 10px;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .save-indicator.show { opacity: 1; }

    /* ── Clear done btn ───────────────────────────────────────────────── */
    .btn-ghost {
      background: none;
      border: 1px solid #c4a8d8;
      border-radius: 6px;
      color: #9878b8;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-ghost:hover { background: #f4eafc; color: var(--primary); border-color: var(--primary); }
    .btn-reorder {
      background: none;
      border: 1px solid #c4a8d8;
      border-radius: 6px;
      color: #9878b8;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-reorder:hover { background: #f4eafc; color: var(--primary); border-color: var(--primary); }
    .btn-reorder.active { background: var(--secondary); color: #fff; border-color: var(--secondary); }

    .btn-edit {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      opacity: 0.6;
      transition: opacity 0.15s;
      flex-shrink: 0;
      line-height: 1;
    }
    .btn-edit:hover { opacity: 1; }
    .btn-edit-icon { display: inline-block; font-size: 1rem; transform: scaleX(-1); }

    /* ── Edit modal ────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .modal-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--primary);
    }
    .modal-text-input {
      width: 100%;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    .modal-text-input:focus { border-color: var(--primary); }
    .modal-row { display: flex; align-items: center; gap: 10px; }
    .modal-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .modal-select {
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--card);
      outline: none;
      cursor: pointer;
    }
    .modal-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 4px; }
    .btn-modal-delete {
      background: none;
      border: 1px solid #c04040;
      border-radius: 6px;
      color: #b03030;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-modal-delete:hover { background: #ffeaea; }
    .btn-modal-save {
      background: none;
      border: 1px solid var(--secondary);
      border-radius: 6px;
      color: var(--secondary);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-modal-save:hover { background: #e0f0ea; }

    .drag-handle {
      font-size: 1rem;
      cursor: grab;
      padding: 2px 2px;
      color: #a890c0;
      flex-shrink: 0;
      touch-action: none;
      user-select: none;
    }
    .drag-handle:active { cursor: grabbing; color: var(--secondary); }
    .task-item.reorder-dragging { opacity: 0.4; }
    .drag-insert-line {
      list-style: none;
      height: 3px;
      background: var(--secondary);
      border-radius: 2px;
      margin: 0 4px;
      pointer-events: none;
    }

    .priority-divider {
      list-style: none;
      border-top: 1px solid rgba(120,80,160,0.12);
      margin: 2px 6px;
    }
    /* ── Notes ────────────────────────────────────────────────────────── */
    .notes-textarea {
      width: 100%;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      resize: vertical;
      min-height: 88px;
      outline: none;
      transition: border-color 0.2s;
    }
    .notes-textarea:focus { border-color: var(--secondary); }

    .note-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .note-card-date {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
    }
    .note-card-hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 6px 0 10px;
    }
    .note-card-text {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bin-subtab-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .bin-subtab {
      flex: 1;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 5px 8px;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.15s;
    }
    .bin-checkbox {
      width: 18px;
      height: 18px;
      accent-color: #9878b8;
      cursor: pointer;
      flex-shrink: 0;
    }
    .bin-card-row { display: flex; align-items: flex-start; gap: 10px; }
    .bin-card-content { flex: 1; min-width: 0; }

    .bin-subtab.active { background: #9878b8; border-color: #9878b8; color: #fff; }
    .bin-subtab-desc {
      font-size: 0.58rem;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      opacity: 0.8;
    }
    .bin-item { display: flex; flex-direction: column; gap: 3px; }
    .bin-item-meta { font-size: 0.68rem; color: var(--text-muted); }
    .bin-item-text { font-size: 0.88rem; color: var(--text); white-space: pre-wrap; word-break: break-word; }

    /* ── Backup actions row ───────────────────────────────────────────── */
    .backup-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 48px;
      padding: 6px 0 2px;
    }
    .btn-backup {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-backup:hover { background: var(--primary-dark); }

    /* ── Footer ───────────────────────────────────────────────────────── */
    .app-footer {
      text-align: center;
      padding: 1em 16px 20px;
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    /* ── Responsive ───────────────────────────────────────────────────── */
    @media (max-width: 380px) {
      .app-header h1 { font-size: 1.6rem; }
      .day-label { min-width: 100px; font-size: 0.9rem; }
      .composer select { display: none; }
    }
    .week-scroll-area { overflow:auto; cursor:grab; touch-action:none; user-select:none; height:calc(100vh - 260px); margin:8px 14px 0; border-radius:var(--radius); }
    .week-scroll-area.dragging { cursor:grabbing; }
    .week-tbl { border-collapse:collapse; table-layout:fixed; }
    .week-tbl th { position:sticky; left:0; z-index:3; width:36px; min-width:36px; padding:10px 4px; background:var(--secondary); color:#fff; font-family:inherit; font-size:0.68rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; text-align:center; white-space:nowrap; writing-mode:vertical-lr; transform:rotate(180deg); border-right:1px solid rgba(255,255,255,0.12); }
    .week-tbl td { width:136px; min-width:136px; height:136px; min-height:136px; padding:7px 6px; vertical-align:top; word-break:break-word; border-right:1px solid rgba(0,0,0,0.04); border-bottom:1px solid rgba(0,0,0,0.04); }
    .week-tbl td.c-light { background:var(--bg); color:#3a3248; }
    .week-tbl td.c-dark  { background:#ead8f4; color:#3a3248; }
    .week-task { display:flex; flex-direction:column; gap:3px; margin-bottom:6px; font-size:0.82rem; line-height:1.3; }
    .week-task-text { font-weight:600; color:var(--text); }
    .week-task-top { display:flex; align-items:center; justify-content:center; gap:4px; }
    .week-badge { font-size:0.82rem; font-weight:700; text-transform:uppercase; padding:2px 6px; border-radius:6px; flex-shrink:0; }
    .c-light .week-badge.p-high   { background:#ffd8d8; color:#b03040; }

  </style>
</head>
<body>

  <script>
    // ── Date helpers ──────────────────────────────────────────────────────────

    function toKey(d) {
      // Local date key "YYYY-MM-DD" — avoids UTC drift
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function formatFull(d) {
      return d.toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
      });
    }

    function formatShort(d) {
      const todayKey = toKey(new Date());
      const key = toKey(d);
      const diff = Math.round(
        (new Date(key + 'T00:00:00') - new Date(todayKey + 'T00:00:00')) / 86400000
      );
      if (diff === 0)  return 'Today';
      if (diff === 1)  return 'Tomorrow';
      if (diff === -1) return 'Yesterday';
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function formatDueTime(iso) {
      const d = new Date(iso);
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function formatDueDate(iso) {
      return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    function getDefaultDue() {
      const d = new Date();
      d.setHours(d.getHours() + 1, 0, 0, 0);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`;
    }

    function shiftDay(d, n) {
      const copy = new Date(d);
      copy.setDate(copy.getDate() + n);
      return copy;
    }

    // ── Storage ───────────────────────────────────────────────────────────────

    const STORAGE_KEY  = 'plannerData';
    const BIN_KEY      = 'jessBoardBin';
    const SWEEP_KEY    = 'jessBoardLastSweep';
    const APP_VERSION  = '0.2';

    function loadAll() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
      catch { return {}; }
    }

    function saveAll(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadBin() {
      try { return JSON.parse(localStorage.getItem(BIN_KEY)) || { completed: [], deleted: [], notes: [] }; }
      catch { return { completed: [], deleted: [], notes: [] }; }
    }

    function saveBin(bin) { localStorage.setItem(BIN_KEY, JSON.stringify(bin)); }

    function getDayData(key) {
      return loadAll()[key] || { tasks: [], notes: '' };
    }

    function saveDayData(key, dayData) {
      const all = loadAll();
      all[key] = dayData;
      saveAll(all);
      flashSaved();
    }

    // ── State ─────────────────────────────────────────────────────────────────

    let currentDate = new Date();

    // ── Rollover ──────────────────────────────────────────────────────────────

    function rolloverPastTasks() {
      const todayKey = toKey(new Date());
      const all = loadAll();
      let changed = false;

      Object.keys(all).forEach(key => {
        if (key >= todayKey) return;
        const incomplete = (all[key].tasks || []).filter(t => !t.done);
        if (!incomplete.length) return;

        const today = all[todayKey] || { tasks: [], notes: '' };
        const existing = new Set(today.tasks.map(t => t.id));
        incomplete.forEach(t => { if (!existing.has(t.id)) { today.tasks.push(t); existing.add(t.id); } });
        all[todayKey] = today;
        all[key].tasks = all[key].tasks.filter(t => t.done);
        changed = true;
      });

      if (changed) saveAll(all);
    }

    // ── Render ────────────────────────────────────────────────────────────────

    function render() {
      rolloverPastTasks();
      const key = toKey(currentDate);
      const day = getDayData(key);

      document.getElementById('full-date').textContent  = formatFull(new Date());
      document.getElementById('day-label').textContent   = formatShort(currentDate);
      document.getElementById('notes-input').value       = day.notes || '';

      renderTasks(day.tasks || []);
    }

    const PRIORITY_ORDER = { high: 0, normal: 1, low: 2 };

    function renderTasks(tasks) {
      // Stable sort preserves user-defined array order within each priority group
      const sorted = [...tasks].sort((a, b) =>
        (PRIORITY_ORDER[a.priority] ?? 1) - (PRIORITY_ORDER[b.priority] ?? 1)
      );
      tasks = sorted;
      const list  = document.getElementById('task-list');
      const fill  = document.getElementById('progress-fill');
      const bar   = document.getElementById('progress-bar');
      const label = document.getElementById('progress-label');

      list.innerHTML = '';

      if (!tasks.length) {
        const li = document.createElement('li');
        li.className = 'empty-state';
        li.id = 'empty-msg';
        li.textContent = 'No tasks yet — add one above!';
        list.appendChild(li);
        fill.style.width = '0%';
        bar.setAttribute('aria-valuenow', 0);
        label.textContent = '0 / 0';
        return;
      }

      const done = tasks.filter(t => t.done).length;
      const pct  = Math.round((done / tasks.length) * 100);
      fill.style.width = pct + '%';
      bar.setAttribute('aria-valuenow', pct);
      label.textContent = `${done} / ${tasks.length}`;

      let prevPriority = null;
      tasks.forEach(task => {
        if (prevPriority !== null && task.priority !== prevPriority) {
          const div = document.createElement('li');
          div.className = 'priority-divider';
          list.appendChild(div);
        }
        prevPriority = task.priority;

        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.dataset.id = task.id;

        let firstEl;
        if (reorderMode) {
          const handle = document.createElement('span');
          handle.className = 'drag-handle';
          handle.textContent = '\u2630';
          handle.setAttribute('aria-label', 'Hold to reorder');
          handle.addEventListener('pointerdown', e => {
            e.preventDefault();
            // Release implicit capture so pointermove/pointerup bubble to document
            e.target.releasePointerCapture(e.pointerId);
            startDrag(task.id);
          });
          firstEl = handle;
        } else {
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = task.done;
          cb.setAttribute('aria-label', `Mark "${task.text}" as ${task.done ? 'not done' : 'done'}`);
          cb.addEventListener('change', () => toggleTask(task.id));
          firstEl = cb;
        }

        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = task.text;

        const badge = document.createElement('span');
        const p = task.priority || 'normal';
        badge.className = `priority-badge p-${p}`;
        badge.textContent = p === 'normal' ? 'NORM' : p;

        const editBtn = document.createElement('button');
        editBtn.className = 'btn-edit';
        editBtn.innerHTML = '<span class="btn-edit-icon">&#x270E;</span>';
        editBtn.setAttribute('aria-label', `Edit task: ${task.text}`);
        editBtn.addEventListener('click', () => openEditor(task.id));

        if (task.due) {
          const now = new Date();
          const dueD = new Date(task.due);
          const overdue = dueD < now;
          const dueToday = !overdue && toKey(dueD) === toKey(now);
          const bubble = document.createElement('div');
          bubble.className = 'due-bubble';
          const tEl = document.createElement('span'); tEl.className = 'due-time'; tEl.textContent = formatDueTime(task.due);
          const dEl = document.createElement('span'); dEl.className = 'due-date'; dEl.textContent = formatDueDate(task.due);
          if (!task.done && (overdue || dueToday)) {
            const icon = document.createElement('span');
            icon.className = 'due-icon';
            icon.textContent = overdue ? '\u274C' : '\u26A0\uFE0F';
            bubble.append(icon, tEl, dEl);
          } else {
            bubble.append(tEl, dEl);
          }
          li.append(firstEl, span, bubble, badge, editBtn);
        } else {
          li.append(firstEl, span, badge, editBtn);
        }
        list.appendChild(li);
      });
    }

    // ── Task actions ──────────────────────────────────────────────────────────

    let pendingDue = '';

    let reorderMode = false;
    let dragId      = null;
    let dragOverId  = null;
    let dragEl      = null;
    let dragBefore  = false;

    function toggleReorder() {
      reorderMode = !reorderMode;
      document.getElementById('reorder-btn').classList.toggle('active', reorderMode);
      renderTasks(getDayData(toKey(currentDate)).tasks);
    }

    function startDrag(id) {
      dragId = id;
      dragEl = document.querySelector(`.task-item[data-id="${id}"]`);
      if (!dragEl) return;
      dragEl.classList.add('reorder-dragging');
      document.addEventListener('pointermove', onDragMove, { passive: false });
      document.addEventListener('pointerup', onDragEnd);
      document.addEventListener('pointercancel', onDragEnd);
    }

    function onDragMove(e) {
      e.preventDefault();
      if (!dragId || !dragEl) return;

      // Hide both the dragged item and the insert line so elementFromPoint sees through them
      const existingLine = document.querySelector('.drag-insert-line');
      dragEl.style.visibility = 'hidden';
      if (existingLine) existingLine.style.display = 'none';
      const under = document.elementFromPoint(e.clientX, e.clientY);
      dragEl.style.visibility = '';
      if (existingLine) existingLine.style.display = '';

      const targetLi = under?.closest('.task-item[data-id]');
      // If pointer is over a gap, divider, or insert line — keep the existing line unchanged
      if (!targetLi || targetLi === dragEl) return;

      const targetId = Number(targetLi.dataset.id);
      const day = getDayData(toKey(currentDate));
      const dragTask   = day.tasks.find(t => t.id === dragId);
      const targetTask = day.tasks.find(t => t.id === targetId);
      if (!dragTask || !targetTask || dragTask.priority !== targetTask.priority) return;

      const rect   = targetLi.getBoundingClientRect();
      const before = e.clientY < rect.top + rect.height / 2;

      // Skip DOM update if the insertion point hasn't actually changed
      if (targetId === dragOverId && before === dragBefore && existingLine) return;

      dragOverId = targetId;
      dragBefore = before;

      if (existingLine) existingLine.remove();
      const line = document.createElement('li');
      line.className = 'drag-insert-line';
      targetLi.parentNode.insertBefore(line, before ? targetLi : targetLi.nextSibling);
    }

    function onDragEnd() {
      document.removeEventListener('pointermove', onDragMove);
      document.removeEventListener('pointerup', onDragEnd);
      document.removeEventListener('pointercancel', onDragEnd);

      if (dragId && dragOverId && dragId !== dragOverId) {
        const key   = toKey(currentDate);
        const day   = getDayData(key);
        const tasks = day.tasks;
        const fromIdx = tasks.findIndex(t => t.id === dragId);
        let   toIdx   = tasks.findIndex(t => t.id === dragOverId);
        if (fromIdx !== -1 && toIdx !== -1 &&
            tasks[fromIdx].priority === tasks[toIdx].priority) {
          const [moved] = tasks.splice(fromIdx, 1);
          toIdx = tasks.findIndex(t => t.id === dragOverId);
          tasks.splice(dragBefore ? toIdx : toIdx + 1, 0, moved);
          saveDayData(key, day);
        }
      }

      document.querySelectorAll('.drag-insert-line').forEach(el => el.remove());
      document.querySelectorAll('.reorder-dragging')
        .forEach(el => el.classList.remove('reorder-dragging'));
      dragId = dragOverId = dragEl = null;
      renderTasks(getDayData(toKey(currentDate)).tasks);
    }

    function updateDueDisplay() {
      const preview   = document.getElementById('due-preview');
      const openBtn   = document.getElementById('open-due-btn');
      const removeBtn = document.getElementById('remove-due-btn');
      if (pendingDue) {
        openBtn.style.display   = 'none';
        preview.style.display   = 'flex';
        removeBtn.style.display = '';
        document.getElementById('due-preview-time').textContent = formatDueTime(pendingDue);
        document.getElementById('due-preview-date').textContent = formatDueDate(pendingDue);
      } else {
        openBtn.style.display   = '';
        preview.style.display   = 'none';
        removeBtn.style.display = 'none';
      }
    }

    function addTask() {
      const input = document.getElementById('task-input');
      const text  = input.value.trim();
      if (!text) { input.focus(); return; }

      const priority = document.getElementById('priority-select').value;
      const key = toKey(currentDate);
      const day = getDayData(key);

      day.tasks.push({ id: Date.now(), text, done: false, priority, due: pendingDue || null });
      saveDayData(key, day);

      input.value = '';
      pendingDue = getDefaultDue();
      document.getElementById('due-picker').value = pendingDue;
      updateDueDisplay();
      input.focus();
      render();
    }

    function toggleTask(id) {
      const key = toKey(currentDate);
      const day = getDayData(key);
      const t   = day.tasks.find(t => t.id === id);
      if (!t) return;
      t.done = !t.done;
      saveDayData(key, day);
      renderTasks(day.tasks);
    }

    function deleteTask(id) {
      const key  = toKey(currentDate);
      const day  = getDayData(key);
      const task = day.tasks.find(t => t.id === id);
      if (task) {
        const bin = loadBin();
        bin.deleted.push({ ...task, date: key, deletedAt: new Date().toISOString() });
        saveBin(bin);
      }
      day.tasks = day.tasks.filter(t => t.id !== id);
      saveDayData(key, day);
      renderTasks(day.tasks);
    }

    function clearDone() {

    // ── Week tab ──────────────────────────────────────────────────────────────

    let currentWeekStart = getMonday(new Date());

    function getMonday(d) {
      const date = new Date(d);
      const day  = date.getDay();
      date.setDate(date.getDate() + (day === 0 ? -6 : 1 - day));
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function getWeekLabel(mon) {
      const todayMon = getMonday(new Date());
      const weeks = Math.round((mon - todayMon) / (7 * 86400000));
      if (weeks === 0)  return 'This Week';
      if (weeks === 1)  return 'Next Week';
      if (weeks === -1) return 'Last Week';
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      const fmt = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      return `${fmt(mon)} \u2013 ${fmt(sun)}`;
    }

    function renderWeekTab() {
      document.getElementById('week-label').textContent = getWeekLabel(currentWeekStart);
      const weekDays = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(currentWeekStart); d.setDate(currentWeekStart.getDate() + i); return d;
      });
      const weekKeys  = weekDays.map(d => toKey(d));
      const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
      const now       = new Date();
      const cols      = Array.from({ length: 8 }, () => []);

      Object.values(loadAll()).forEach(day => {
        (day.tasks || []).forEach(task => {
          if (task.due) {
            const idx = weekKeys.indexOf(toKey(new Date(task.due)));
            if (idx !== -1) {
              const dueD = new Date(task.due);
              const overdue  = dueD < now;
              const dueToday = !overdue && toKey(dueD) === toKey(now);
              cols[idx].push({ ...task, overdue, dueToday });
            }
          } else {
            cols[7].push({ ...task, overdue: false });
          }
        });
      });
      for (let i = 0; i < 8; i++) cols[i].sort((a, b) => (a.due || '').localeCompare(b.due || ''));

      const maxCols   = Math.max(1, ...cols.map(c => c.length));
      const container = document.getElementById('week-table-inner');
      container.innerHTML = '';

      const tbl  = document.createElement('table'); tbl.className = 'week-tbl';
      const tbody = document.createElement('tbody');

      const mkIcon = task => {
        if (!task.done && !task.overdue && !task.dueToday) return null;
        const s = document.createElement('span');
        if (task.done)          { s.textContent = '\u2713';           s.style.cssText = 'color:#2e7d32;font-size:0.75rem;font-weight:bold;'; }
        else if (task.overdue) { s.textContent = '\u274C';           s.style.fontSize = '0.7rem'; }
        else                   { s.textContent = '\u26A0\uFE0F';     s.style.fontSize = '0.8rem'; }
        return s;
      };

      // One row per day/anytime; tasks expand rightward — Anytime first
      for (const row of [7, 0, 1, 2, 3, 4, 5, 6]) {
        const tr = document.createElement('tr');
        const th = document.createElement('th');
        if (row < 7) {
          th.textContent = `${DAY_NAMES[row]} - ${weekDays[row].getDate()} - ${weekDays[row].toLocaleDateString('en-GB',{month:'short'})}`;
        } else {
          th.textContent = 'Anytime';
        }
        tr.appendChild(th);
        for (let col = 0; col < maxCols; col++) {
          const td = document.createElement('td');
          td.className = (row + col) % 2 === 0 ? 'c-light' : 'c-dark';
          const task = cols[row][col];
          if (task) {
            const te  = document.createElement('div'); te.className = 'week-task';
            const top = document.createElement('div'); top.className = 'week-task-top';
            const p   = task.priority || 'normal';
            const b   = document.createElement('span'); b.className = `week-badge p-${p}`; b.textContent = p === 'normal' ? 'NORM' : p.toUpperCase();
            const iL = mkIcon(task); const iR = mkIcon(task);
            if (iL) top.appendChild(iL);
            top.appendChild(b);
            if (iR) top.appendChild(iR);
            const tx = document.createElement('span'); tx.className = 'week-task-text'; tx.textContent = task.text;
            if (task.done) tx.style.textDecoration = 'line-through';
            te.append(top, tx); td.appendChild(te);
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      tbl.appendChild(tbody);
      container.appendChild(tbl);
    }

    // Drag-to-pan week scroll area (pointer capture keeps events on element)
    (function() {
      const el = document.getElementById('week-scroll');
      let active = false, sx, sy, sl, st;
      el.addEventListener('pointerdown', e => {
        active = true; sx = e.clientX; sy = e.clientY;
        sl = el.scrollLeft; st = el.scrollTop;
        el.setPointerCapture(e.pointerId);
        el.classList.add('dragging');
        e.preventDefault();
      });
      el.addEventListener('pointermove', e => {
        if (!active) return;
        el.scrollLeft = sl - (e.clientX - sx);
        el.scrollTop  = st - (e.clientY - sy);
      });
      const end = () => { active = false; el.classList.remove('dragging'); };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
    })();

    // ── Sunday midnight sweep ───────────────────────────────────────────────────

    function checkSundaySweep() {
      const now = new Date();
      const d = new Date(now);
      d.setDate(d.getDate() - d.getDay()); // rewind to this week's Sunday
      d.setHours(0, 0, 0, 0);
      const thisSundayKey = toKey(d);
      if ((localStorage.getItem(SWEEP_KEY) || '') >= thisSundayKey) return;

      const todayKey = toKey(now);
      const all = loadAll();
      const bin = loadBin();
      let changed = false;
      Object.keys(all).forEach(key => {
        if (key >= todayKey) return;
        const done = all[key].tasks.filter(t => t.done);
        if (!done.length) return;
        done.forEach(t => bin.completed.push({ ...t, date: key, addedAt: now.toISOString() }));
        all[key].tasks = all[key].tasks.filter(t => !t.done);
        changed = true;
      });
      if (changed) { saveAll(all); saveBin(bin); }
      localStorage.setItem(SWEEP_KEY, thisSundayKey);
    }

    function deleteOldNotes() {
      const todayKey = toKey(new Date());
      const all = loadAll();
      const bin = loadBin();
      const old = Object.keys(all).filter(k => k < todayKey && all[k].notes?.trim());
      if (!old.length) { alert('No old notes to delete.'); return; }
      if (!confirm(`Delete notes from ${old.length} day(s) before today? They will be moved to the Bin.`)) return;
      old.forEach(k => {
        bin.notes.push({ date: k, text: all[k].notes, deletedAt: new Date().toISOString() });
        all[k].notes = '';
      });
      saveAll(all); saveBin(bin);
      renderNotesTab();
    }

    // ── OPFS backup (called only by manual export; not on every save) ──────────
    // Writes to origin-private file system: local_app_storage/alfiejwDailyPlannerApp/backup.json
    // Note: OPFS is sandboxed — not visible in the phone's file manager.
    // Use the Export button to save to Downloads instead.

    async function backupToOPFS() {
      // Race the write against a 4-second timeout so a stalled OPFS promise can't block forever
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000));
      try {
        await Promise.race([doOPFSWrite(), timeout]);
        setBackupStatus('done');
      } catch (err) {
        console.warn('OPFS backup:', err.message || err);
        setBackupStatus('error');
      }
    }

    async function doOPFSWrite() {
      if (!navigator.storage?.getDirectory) throw new Error('no OPFS');
      const root  = await navigator.storage.getDirectory();
      const dir1  = await root.getDirectoryHandle('local_app_storage', { create: true });
      const dir2  = await dir1.getDirectoryHandle('alfiejwDailyPlannerApp', { create: true });
      const fh    = await dir2.getFileHandle('backup.json', { create: true });
      // createWritable is absent or broken on iOS Safari < 17
      if (typeof fh.createWritable !== 'function') throw new Error('createWritable unsupported');
      const writable = await fh.createWritable();
      await writable.write(JSON.stringify({
        version: 1, appVersion: APP_VERSION,
        exportedAt: new Date().toISOString(),
        plannerData: loadAll()
      }, null, 2));
      await writable.close();
    }

    // ── Export / Import ───────────────────────────────────────────────────────

    function exportData() {
      const payload = JSON.stringify({
        version: 1, appVersion: APP_VERSION,
        exportedAt: new Date().toISOString(),
        plannerData: loadAll()
      }, null, 2);
      const url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
      const a = Object.assign(document.createElement('a'), {
        href: url,
        download: `planner-backup-${new Date().toISOString().slice(0,10)}.json`
      });
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          const raw = parsed.plannerData ?? parsed;
          const normalized = {};
          Object.entries(raw).forEach(([date, day]) => {
            normalized[date] = {
              tasks: (day.tasks || []).map(t => ({
                id:       t.id       ?? Date.now(),
                text:     t.text     ?? '',
                done:     t.done     ?? false,
                priority: t.priority ?? 'normal',
                due:      t.due      ?? null,
              })),
              notes: day.notes ?? ''
            };
          });
          saveAll(normalized);
          render();
        } catch {
          alert('Invalid or unrecognised backup file.');
        }
      };
      reader.readAsText(file);
    }

    document.getElementById('export-btn').addEventListener('click', () => {
      if (confirm('Export your planner data as a JSON file to your Downloads folder?\n\nYour current data will not be affected — this only creates a copy.')) exportData();
    });
    document.getElementById('import-btn').addEventListener('click', () => {
      if (confirm('Import from a previously exported backup file?\n\nThis will REPLACE all current tasks and notes with the contents of that file. If no backup file has been exported, nothing will happen. This cannot be undone.')) {
        document.getElementById('import-input').click();
      }
    });
    document.getElementById('import-input').addEventListener('change', e => {
      if (e.target.files[0]) { importData(e.target.files[0]); e.target.value = ''; }
    });
  </script>
</body>
</html>
